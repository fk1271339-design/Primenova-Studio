spring:
  config:
    # Dev/source runs (`mvn spring-boot:run`) ke liye project-root .env ko
    # automatically load karo — warna SMTP/OAuth placeholder credentials pe
    # jata hai aur "Authentication failed" aata hai. [.properties] suffix
    # Spring ko .env ko properties format mein parse karne ke liye batata hai.
    # Optional: file na mile toh defaults (application.yml) use hote hain.
    # run-backend.bat / docker-compose env vars set karte hain — wo precedence
    # mein inhe override kar dete hain, isliye koi conflict nahi.
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: studio

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/primenova_db}
      # Auto-create indexes declared via @Indexed (unique email / token indexes).
      # NOTE: if existing data already contains duplicate emails the unique index
      # creation fails at startup — deduplicate first (see audit report).
      auto-index-creation: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:CHANGE_ME}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope:
              - read:user
              - user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:placeholder@gmail.com}
    password: ${SMTP_PASSWORD:CHANGE_ME}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Fail fast instead of hanging for 60s+ when SMTP is unreachable
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwtSecret: ${JWT_SECRET:change-me-to-a-long-random-secret-key-min-32-chars}
  jwtAccessExpirationMs: ${JWT_ACCESS_EXPIRATION:900000}
  jwtRefreshExpirationMs: ${JWT_REFRESH_EXPIRATION:86400000}
  adminEmail: ${ADMIN_EMAIL:hello@primenova.studio}
  # Sender address on all emails. Defaults to the SMTP username — Gmail rejects
  # messages whose From differs from the authenticated account.
  mailFrom: ${SMTP_FROM:${SMTP_USERNAME:placeholder@gmail.com}}
  # Free keyless IP geolocation (ipwho.is). Disable with GEO_LOOKUP_ENABLED=false for offline dev.
  geoApiUrl: ${GEO_API_URL:https://ipwho.is/}
  geoLookupEnabled: ${GEO_LOOKUP_ENABLED:true}
  # Frontend base URL — OAuth callback + email verification/reset links isi se bante hain
  frontendUrl: ${FRONTEND_URL:http://localhost:5173}
  # Email verification token lifetime + resend cooldown (anti-spam).
  verificationTokenExpiryHours: ${VERIFICATION_TOKEN_EXPIRY_HOURS:24}
  emailResendCooldownSeconds: ${EMAIL_RESEND_COOLDOWN_SECONDS:60}
  # CORS allowed origins (comma separated)
  corsOrigins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80}

logging:
  # Real-time file log — console (stdout redirect) chunk-buffered hota hai, isliye
  # errors turant nahi dikhte. File appender immediateFlush karta hai, isliye
  # backend\logs\application.log me har line turant aati hai.
  file:
    name: ${LOG_FILE:logs/application.log}

server:
  port: 8080
  # Reverse proxy ke peeche bhi {baseUrl} sahi resolve ho (X-Forwarded-* headers)
  forward-headers-strategy: framework
